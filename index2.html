<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi sitio web</title>
 <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ddd;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 1200px;
      background-color: #2196F3;
    }

    .header {
      background-color: #4CAF50;
      color: white;
      padding: 20px;
    }

    .nav button {
      background-color: #388e3c;
      border: none;
      color: white;
      padding: 10px 15px;
      margin: 5px 5px 0 0;
      border-radius: 4px;
      cursor: pointer;
    }

    .section {
      padding: 20px;
      margin: 10px;
      border-radius: 5px;
    }

    .bienvenido {
      background-color: #f1c40f;
      color: black;
    }

    .destacado {
      background-color: #FF5722;
      color: white;
    }

    .noticias {
      background-color: #8e44ad;
      color: white;
    }

    .noticias ul {
      list-style: none;
      padding: 0;
    }

    .noticias li {
      background-color: #6c3483;
      margin: 5px 0;
      padding: 10px;
      border-radius: 4px;
    }

    footer {
    background-color: #607D8B; 
    color: white;
    text-align: center;
    padding: 10px 0;
    width: 100%;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Mi sitio web</h1>
      <div class="nav">
        <button>Inicio</button>
        <button>Servicios</button>
        <button>Contacto</button>
      </div>
    </div>

    <div class="section bienvenido">
      <h2>Bienvenido</h2>
      <p>Bienvenido a mi pagina, disfruta de las siguientes secciones :D</p>
    </div>

    <div class="section destacado">  
      <h2>Artículo destacado</h2>
      <P></P>
        <center><img src="IMG/foca.jpg" border="1" width="200" height="150" alt="foca"></center>  
    </div>

    <div class="section noticias">
      <h2>Noticias recientes</h2>
      <ul>
        <li>Nota 1</li>
        <li>Nota 2</li>
        <li>Nota 3</li>
      </ul>
    </div>
  <footer>
        <p>© 2025 - Mi sitio web. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
